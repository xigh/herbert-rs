[package]
name = "herbert-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Herbert desktop chat application"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
herbert-core = { path = "../../core" }
herbert-vision = { path = "../../vision" }
herbert-backend-metal = { path = "../../backends/backend_metal" }
image = { workspace = true }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokenizers = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
base64 = "0.22"

[target.'cfg(not(any(android, ios)))'.dependencies]
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
