[package]
name = "herbert-backend-metal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["simdgroup-matmul"]
debug-dump = []
vision-debug = []
prefill-profile = []
simdgroup-matmul = []

[dependencies]
herbert-core = { path = "../../core" }
herbert-backend-common = { path = "../backend_common" }
herbert-vision = { path = "../../vision" }
safetensors = { workspace = true }
half = { workspace = true }
memmap2 = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLLibrary",
    "MTLBuffer",
    "MTLResource",
    "MTLTypes",
    "MTLFunctionConstantValues",
    "MTLFunctionDescriptor",
    "MTLBlitCommandEncoder",
    "MTLArgument",
    "MTLPixelFormat",
    "MTLAllocation",
    "MTLCounters",
    "MTLEvent",
    "block2",
    "dispatch2",
] }
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSData"] }
